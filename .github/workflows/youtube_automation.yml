name: YouTube Automation Scheduler

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 19 * * *"
    - cron: "0 01 * * *"
  workflow_dispatch: {}

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "CLIENT_ID=${{ secrets.CLIENT_ID }}" >> .env
          echo "CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}" >> .env
          echo "REFRESH_TOKEN_AI_PULSE_DAILY=${{ secrets.REFRESH_TOKEN_AI_PULSE_DAILY }}" >> .env
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env

      - name: Run YouTube automation scheduler
        run: |
          python3 main.py --run-now
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN_AI_PULSE_DAILY: ${{ secrets.REFRESH_TOKEN_AI_PULSE_DAILY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
